<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>やまの湯予約管理 Ver1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>🏨 やまの湯予約管理 Ver1</h1></header>
<main class="card">
<label>宿泊日</label>
<input type="date" id="date">
<div class="status">山久 <span id="yamakyu">0</span>/5組</div>
<h2>部屋一覧</h2>
<div id="rooms"></div>
<button>➕予約追加</button>
<button>🔍空室検索</button>
</main>
  <div id="reservationModal" class="modal">
  <div class="modal-content">
    <h2 id="roomTitle">予約入力</h2>

    <label>宿泊者名</label>
    <input type="text" id="guestName">

    <label>人数</label>
    <input type="number" id="guestCount">

    <button id="saveBtn">保存</button>
    <button id="closeBtn">閉じる</button>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
